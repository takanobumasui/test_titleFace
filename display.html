<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タイトル表示</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Noto+Serif+JP:wght@300;400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Serif JP', serif;
  }

  .label {
    background: #0a0a0a;
    border: 1px solid #444;
    padding: 18px 24px;
    max-width: 320px;
    width: 90vw;
    position: relative;
  }

  .label::before {
    content: '';
    position: absolute;
    inset: 3px;
    border: 0.5px solid #333;
    pointer-events: none;
  }

  .title-text {
    font-family: 'IM Fell English', serif;
    font-size: clamp(18px, 5vw, 26px);
    color: #f0ece4;
    line-height: 1.4;
    letter-spacing: 0.01em;
    min-height: 1.4em;
    transition: opacity 0.6s ease;
  }

  .title-text.fade {
    opacity: 0;
  }

  .title-text.jp {
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(16px, 4.5vw, 22px);
    font-weight: 400;
  }

  .meta {
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .year {
    font-size: 10px;
    color: #666;
    letter-spacing: 0.15em;
    font-family: 'IM Fell English', serif;
  }

  .updated {
    font-size: 9px;
    color: #555;
    letter-spacing: 0.05em;
  }

  .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: #f0ece4;
    margin-left: 2px;
    vertical-align: middle;
    animation: blink 1.1s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
</style>
</head>
<body>
<div class="label">
  <div class="title-text jp" id="titleDisplay">無題</div>
  <div class="meta">
    <span class="year">2025</span>
    <span class="updated" id="updatedTime"></span>
  </div>
</div>

<script>
  // デモ用：LocalStorageで表示・投稿ページ間で同期
  const titleEl = document.getElementById('titleDisplay');
  const updatedEl = document.getElementById('updatedTime');

  function detectJP(text) {
    return /[\u3040-\u30FF\u4E00-\u9FFF]/.test(text);
  }

  function updateDisplay(text, time) {
    titleEl.classList.add('fade');
    setTimeout(() => {
      titleEl.textContent = text || '無題';
      titleEl.className = 'title-text ' + (detectJP(text) ? 'jp' : '');
      titleEl.classList.add('fade');
      requestAnimationFrame(() => {
        requestAnimationFrame(() => titleEl.classList.remove('fade'));
      });
      if (time) updatedEl.textContent = time;
    }, 600);
  }

  function checkStorage() {
    const saved = localStorage.getItem('painting_title');
    if (saved) {
      const data = JSON.parse(saved);
      updateDisplay(data.title, data.time);
    }
  }

  checkStorage();
  setInterval(checkStorage, 1000);
</script>
</body>
</html>
