<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タイトル表示</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Noto+Serif+JP:wght@300;400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Serif JP', serif;
  }
  .label {
    background: #0a0a0a;
    border: 1px solid #ffffff;
    padding: 18px 24px;
    max-width: 320px;
    width: 90vw;
    position: relative;
  }
  .label::before {
    content: '';
    position: absolute;
    inset: 3px;
    border: 0.5px solid #ffffff;
    pointer-events: none;
  }
  .title-text {
    font-family: 'IM Fell English', serif;
    font-size: clamp(18px, 5vw, 26px);
    color: #ffffff;
    line-height: 1.4;
    letter-spacing: 0.01em;
    min-height: 1.4em;
    transition: opacity 0.6s ease;
  }
  .title-text.fade { opacity: 0; }
  .title-text.jp {
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(16px, 4.5vw, 22px);
    font-weight: 400;
  }
  .meta {
    margin-top: 10px;
    display: flex;
    gap: 12px;
    align-items: baseline;
  }
  .year {
    font-size: 10px;
    color: #ffffff;
    letter-spacing: 0.15em;
    font-family: 'IM Fell English', serif;
    white-space: nowrap;
  }
  .material {
    font-size: 10px;
    color: #ffffff;
    letter-spacing: 0.08em;
    font-family: 'Noto Serif JP', serif;
    font-weight: 300;
  }
</style>
</head>
<body>
<div class="label">
  <div class="title-text jp" id="titleDisplay">無題</div>
  <div class="meta">
    <span class="year">2026</span>
    <span class="material">ボールペン、コピー用紙</span>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCGC00UAHfbRlg-3jGO5OKYpH8y3dwG1Nc",
    authDomain: "test-titleface.firebaseapp.com",
    databaseURL: "https://test-titleface-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "test-titleface",
    storageBucket: "test-titleface.firebasestorage.app",
    messagingSenderId: "1052909282265",
    appId: "1:1052909282265:web:aae76ccfb69451172b2fc8",
    measurementId: "G-69BW0SZZ15"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const titleEl = document.getElementById('titleDisplay');
  let isFirst = true;

  const audio = new Audio('決定ボタンを押す53.mp3');
  audio.playbackRate = 0.7;

  // タップで音声を事前ロード
  document.addEventListener('touchstart', () => {
    audio.load();
  }, { once: true });

  function detectJP(text) {
    return /[\u3040-\u30FF\u4E00-\u9FFF]/.test(text);
  }

  function playPon() {
    try {
      audio.currentTime = 0;
      audio.playbackRate = 0.7;
      audio.play().catch(e => console.log(e));
    } catch(e) { console.log(e); }
  }

  function updateDisplay(text) {
    titleEl.classList.add('fade');
    setTimeout(() => {
      titleEl.textContent = text || '無題';
      titleEl.className = 'title-text ' + (detectJP(text) ? 'jp' : '');
      titleEl.classList.add('fade');
      requestAnimationFrame(() => {
        requestAnimationFrame(() => titleEl.classList.remove('fade'));
      });
    }, 600);
  }

  const titleRef = ref(db, 'title');
  onValue(titleRef, (snapshot) => {
    const data = snapshot.val();
    if (data) {
      if (!isFirst) playPon();
      updateDisplay(data.text);
    }
    isFirst = false;
  });
</script>
</body>
</html>
